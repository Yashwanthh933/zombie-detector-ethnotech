spring.application.name=zombie-detector

# JWT signing secret -- MUST be overridden via the JWT_SECRET env var in any real
# deployment (e.g. on Render). The default here is dev-only and not secure.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes}
app.jwt.expiration-ms=3600000

# Default admin account, seeded once on first boot if it doesn't already exist.
# Override both via env vars before deploying anywhere real.
app.admin.email=${ADMIN_EMAIL:admin@zombiedetector.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# --- Server / persistence ---------------------------------------------------------
# Render injects PORT. Locally this stays 8080.
server.port=${PORT:8080}

# Default DB is in-memory H2 (data is lost on restart). For real persistence run with
# SPRING_PROFILES_ACTIVE=postgres (see application-postgres.properties).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Optional comma-separated extra CORS origins (e.g. a custom domain for the frontend).
app.cors.extra-origins=${CORS_EXTRA_ORIGINS:}

# Brute-force protection on /api/auth/login and /register: attempts per IP per window.
app.auth.rate-limit.max-attempts=${AUTH_RATE_LIMIT:10}
app.auth.rate-limit.window-seconds=60
