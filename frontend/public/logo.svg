<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Shield/Card Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Primary Brand Gradient (Sky to Blue) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Accent Emerald Gradient (Live/Savings) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Decorative Cloud/Network Nodes in Background -->
  <g opacity="0.4">
    <circle cx="100" cy="120" r="4" fill="#0284c7" />
    <circle cx="400" cy="100" r="6" fill="#0284c7" />
    <circle cx="380" cy="380" r="5" fill="#0284c7" />
    <circle cx="120" cy="360" r="4" fill="#0284c7" />
    <path d="M100 120 L200 160 L400 100" stroke="#bae6fd" stroke-width="2" fill="none" />
    <path d="M120 360 L220 300 L380 380" stroke="#bae6fd" stroke-width="2" fill="none" />
  </g>

  <!-- Central Shield Container -->
  <g filter="url(#softShadow)">
    <path d="M250 70 C330 70 380 90 380 90 C380 220 340 330 250 410 C160 330 120 220 120 90 C120 90 170 70 250 70 Z" fill="url(#shieldGrad)" stroke="#e0f2fe" stroke-width="4" />
  </g>

  <!-- Inner Cloud Silhouette / Skyline Motif -->
  <path d="M180 260 C165 260 155 245 160
           230 C165 220 175 215 185 218 C195 200 220 195 235 210 C245 200 265 200 275 215 C290 210 305 220 310 235 C320 240 320 260 305 265 Z" 
        fill="#f0fdf4" stroke="#a7f3d0" stroke-width="2" opacity="0.8" />

  <!-- Sentinel Robot / Server Head (Z-Detector Motif) -->
  <g transform="translate(0, -10)">
    <!-- Antenna -->
    <line x1="250" y1="135" x2="250" y2="165" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="250" cy="130" r="8" fill="url(#emeraldGrad)" filter="url(#glow)" />

    <!-- Head Chassis -->
    <rect x="195" y="165" width="110" height="95" rx="24" fill="url(#primaryGrad)" filter="url(#softShadow)" />

    <!-- Visor Screen -->
    <rect x="212" y="185" width="76" height="50" rx="12" fill="#0f172a" />

    <!-- Glowing Digital Eyes (Z-Pulse) -->
    <circle cx="235" cy="210" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="265" cy="210" r="7" fill="#38bdf8" filter="url(#glow)" />
    <!-- Center scanning beam -->
    <ellipse cx="250" cy="210" rx="18" ry="3" fill="#34d399" opacity="0.8" />

    <!-- Ear / Cooling Vents -->
    <rect x="183" y="195" width="12" height="15" rx="4" fill="#93c5fd" />
    <rect x="305" y="195" width="12" height="15" rx="4" fill="#93c5fd" />
    <rect x="183" y="220" width="12" height="15" rx="4" fill="#93c5fd" />
    <rect x="305" y="220" width="12" height="15" rx="4" fill="#93c5fd" />
  </g>

  <!-- Cost Savings / Optimization Indicator Badge -->
  <g transform="translate(250, 315)" filter="url(#softShadow)">
    <rect x="-75" y="-22" width="150" height="44" rx="22" fill="url(#emeraldGrad)" />
    <text x="0" y="5" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="16" letter-spacing="1" text-anchor="middle">
      -$ SAVINGS
    </text>
  </g>

  <!-- Floating Sparkles / Cloud Accent Dots -->
  <circle cx="335" cy="170" r="5" fill="#34d399" filter="url(#glow)" />
  <circle cx="165" cy="170" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="310" cy="285" r="3.5" fill="#38bdf8" />
  <circle cx="190" cy="285" r="3" fill="#34d399" />
</svg>
