<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="zombieGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="50" cy="50" r="46" fill="#fff1f2" stroke="#fecdd3" stroke-width="2" />

  <!-- VM Server Rack Base Icon -->
  <g transform="translate(26, 28) scale(0.48)">
    <rect x="10" y="10" width="80" height="25" rx="6" fill="url(#roseGrad)" opacity="0.3" />
    <rect x="10" y="45" width="80" height="25" rx="6" fill="url(#roseGrad)" opacity="0.6" />
    <rect x="10" y="80" width="80" height="25" rx="6" fill="url(#roseGrad)" />
    
    <!-- Server Status Lights (Zombie Red) -->
    <circle cx="25" cy="22.5" r="4" fill="#f43f5e" filter="url(#zombieGlow)" />
    <circle cx="40" cy="22.5" r="4" fill="#f43f5e" filter="url(#zombieGlow)" />
    
    <circle cx="25" cy="57.5" r="4" fill="#f43f5e" filter="url(#zombieGlow)" />
    <circle cx="40" cy="57.5" r="4" fill="#f43f5e" filter="url(#zombieGlow)" />
    
    <circle cx="25" cy="92.5" r="4" fill="#ffffff" filter="url(#zombieGlow)" />
    <circle cx="40" cy="92.5" r="4" fill="#ffffff" filter="url(#zombieGlow)" />
  </g>

  <!-- Small Warning / Zombie Cross Overlay -->
  <circle cx="72" cy="28" r="14" fill="#e11d48" stroke="#ffffff" stroke-width="3" />
  <text x="72" y="33" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">Z</text>
</svg>
